[package]
name = "framewell"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "An open-source capture, annotation and visual guide workspace"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.25", default-features = false }
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[profile.release]
opt-level = 2
